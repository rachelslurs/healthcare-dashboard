services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Use named volume for database and uploads to avoid file/directory conflicts
      - backend-data:/app/data
    environment:
      - SEED_PATIENT_COUNT=${SEED_PATIENT_COUNT:-20}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./healthcare.db}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        # Sync Python source files for hot reload
        - action: sync
          path: ./backend/app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
        # Rebuild when dependencies change
        - action: rebuild
          path: ./backend/requirements.txt
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # Keep node_modules as a volume to avoid syncing it
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host
    restart: unless-stopped
    develop:
      watch:
        # Sync source files for Vite HMR
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        # Sync config files that might affect dev server
        - action: sync
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json
        # Rebuild when dependencies change
        - action: rebuild
          path: ./frontend/package.json

volumes:
  backend-data:
