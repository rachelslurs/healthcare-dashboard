services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Use named volume for database and uploads to avoid file/directory conflicts
      - backend-data:/app/data
    environment:
      - SEED_PATIENT_COUNT=${SEED_PATIENT_COUNT:-20}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./healthcare.db}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    develop:
      watch:
        # Rebuild when dependencies change
        - action: rebuild
          path: ./backend/requirements.txt
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume for node_modules preserves build-time dependencies
      # This prevents the source mount from overriding node_modules and
      # avoids unnecessary reinstalls on container start
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    # Entrypoint script will handle dependency installation and show feedback
    command: npm run dev -- --host
    restart: unless-stopped
    develop:
      watch:
        # Rebuild when dependencies change
        # Watch package-lock.json as it's the authoritative source for exact versions
        # This catches updates from npm install, security patches, and dependency updates
        - action: rebuild
          path: ./frontend/package-lock.json
        # Also watch package.json in case new dependencies are added without lock file update
        - action: rebuild
          path: ./frontend/package.json

volumes:
  backend-data:
